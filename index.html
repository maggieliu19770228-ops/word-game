<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學習英文小天地 ✨</title>
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif; }
        body {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #ff6b6b; font-size: 24px; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .tab-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active { background: #ff6b6b; color: white; }
        .tab-btn:not(.active) { background: #f0f0f0; color: #666; }
        
        .card {
            border: 3px dashed #ffb6b9;
            border-radius: 20px;
            padding: 30px 15px;
            margin-bottom: 20px;
            background: #fff9f9;
        }
        .word { font-size: 32px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .meaning { font-size: 20px; color: #888; margin-bottom: 20px; }
        
        .speak-btn {
            background: #ffd166;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .speak-btn:active { transform: scale(0.95); }

        .nav-group { display: flex; justify-content: space-between; align-items: center; }
        .nav-btn {
            background: #4ea8de;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .nav-btn:active { transform: scale(0.95); }
        .counter { font-size: 16px; font-weight: bold; color: #555; }

        /* 測驗模式樣式 */
        .quiz-container { display: none; text-align: left; }
        .quiz-question { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 15px; text-align: center; }
        .option-btn {
            display: block;
            width: 100%;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }
        .option-btn:hover { background: #e9ecef; }
        .score-board { font-size: 20px; font-weight: bold; color: #2a9d8f; text-align: center; margin-bottom: 15px; }
        
        /* 答錯提示特效 */
        .feedback-msg {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            min-height: 35px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ 學習英文小天地 ✨</h1>
    
    <!-- 模式切換按鈕 -->
    <div class="btn-group">
        <button class="tab-btn active" id="learnTab" onclick="switchMode('learn')">📖 單字學習</button>
        <button class="tab-btn" id="quizTab" onclick="switchMode('quiz')">🎮 趣味測驗 (10題)</button>
    </div>

    <!-- 學習模式區塊 -->
    <div id="learnSection">
        <div class="card">
            <div class="word" id="wordDisplay">Green Salad</div>
            <div class="meaning" id="meaningDisplay">綠色沙拉</div>
            <button class="speak-btn" onclick="speakCurrentWord()">🔊 聽發音</button>
        </div>
        <div class="nav-group">
            <button class="nav-btn" onclick="prevWord()">⬅️ 上一個</button>
            <span class="counter" id="counterDisplay">1 / 10</span>
            <button class="nav-btn" onclick="nextWord()">下一個 ➡️</button>
        </div>
    </div>

    <!-- 測驗模式區塊 -->
    <div id="quizSection" class="quiz-container">
        <div class="score-board" id="scoreDisplay">得分：0 / 10</div>
        <div class="quiz-question" id="quizQuestion">請問「綠色沙拉」的英文是？</div>
        <div id="optionsGroup"></div>
        <div class="feedback-msg" id="feedbackMsg"></div>
        <button class="nav-btn" id="nextQuizBtn" style="width:100%; margin-top:10px; display:none;" onclick="nextQuiz()">下一題 ➡️</button>
    </div>
</div>

<script>
    // 擴充至 10 個單字的資料庫
    const wordsData = [
        { word: "fashion", meaning: "時尚" },
        { word: "fashion brand", meaning: "時尚品牌" },
        { word: "buyer", meaning: "採購" },
        { word: "stylist", meaning: "造型師" },
        { word: "retailer", meaning: "零售商" },
        { word: "T-shirt", meaning: "T恤" },
        { word: "shirt", meaning: "襯衫" },
        { word: "dress", meaning: "洋裝" },
        { word: "jeans", meaning: "牛仔褲" },
        { word: "pants", meaning: "長褲" }
    ];

    let currentLearnIndex = 0;
    let score = 0;
    let quizCount = 0;
    const maxQuizLimit = 10; // 限制測驗為 10 題

    // --- 學習模式邏輯 ---
    function updateLearnCard() {
        document.getElementById("wordDisplay").innerText = wordsData[currentLearnIndex].word;
        document.getElementById("meaningDisplay").innerText = wordsData[currentLearnIndex].meaning;
        document.getElementById("counterDisplay").innerText = `${currentLearnIndex + 1} / ${wordsData.length}`;
    }

    function nextWord() {
        currentLearnIndex = (currentLearnIndex + 1) % wordsData.length;
        updateLearnCard();
    }

    function prevWord() {
        currentLearnIndex = (currentLearnIndex - 1 + wordsData.length) % wordsData.length;
        updateLearnCard();
    }

    // 穩定的語音播放函數
    function speakCurrentWord() {
        const word = wordsData[currentLearnIndex].word;
        const audioUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=1`;
        const audio = new Audio(audioUrl);
        audio.play().catch(error => {
            alert("正在連線語音，請再點一次看看！");
        });
    }

    // --- 模式切換邏輯 ---
    function switchMode(mode) {
        if (mode === 'learn') {
            document.getElementById("learnTab").classList.add("active");
            document.getElementById("quizTab").classList.remove("active");
            document.getElementById("learnSection").style.display = "block";
            document.getElementById("quizSection").style.display = "none";
            updateLearnCard();
        } else {
            document.getElementById("quizTab").classList.add("active");
            document.getElementById("learnTab").classList.remove("active");
            document.getElementById("learnSection").style.display = "none";
            document.getElementById("quizSection").style.display = "block";
            resetQuiz();
        }
    }

    // --- 測驗模式邏輯 ---
    let correctAnswer = "";

    function resetQuiz() {
        score = 0;
        quizCount = 0;
        document.getElementById("scoreDisplay").innerText = `得分：0 / ${maxQuizLimit}`;
        startQuiz();
    }

    function startQuiz() {
        // 如果已經完成 10 題，顯示結算畫面
        if (quizCount >= maxQuizLimit) {
            document.getElementById("quizQuestion").innerText = `🎉 測驗結束！總得分：${score} / ${maxQuizLimit}`;
            document.getElementById("optionsGroup").innerHTML = `<button class="nav-btn" style="width:100%;" onclick="resetQuiz()">再玩一次 🔄</button>`;
            document.getElementById("nextQuizBtn").style.display = "none";
            document.getElementById("feedbackMsg").innerText = "";
            return;
        }

        document.getElementById("nextQuizBtn").style.display = "none";
        document.getElementById("feedbackMsg").innerText = "";
        
        // 隨機挑選一個題目
        const target = wordsData[Math.floor(Math.random() * wordsData.length)];
        correctAnswer = target.word;

        document.getElementById("quizQuestion").innerText = `第 ${quizCount + 1} 題：請問「${target.meaning}」的英文是？`;

        // 產生選項
        let options = [target.word];
        while (options.length < 4 && options.length < wordsData.length) {
            let randomWord = wordsData[Math.floor(Math.random() * wordsData.length)].word;
            if (!options.includes(randomWord)) {
                options.push(randomWord);
            }
        }
        options.sort(() => Math.random() - 0.5);

        // 渲染選項按鈕
        let optionsHtml = "";
        options.forEach(opt => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(this, '${opt}')">${opt}</button>`;
        });
        document.getElementById("optionsGroup").innerHTML = optionsHtml;
    }

    function checkAnswer(btn, selected) {
        quizCount++;
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(b => b.disabled = true); // 鎖定選項

        const feedback = document.getElementById("feedbackMsg");

        if (selected === correctAnswer) {
            score++;
            btn.style.background = "#d4edda";
            btn.style.borderColor = "#c3e6cb";
            btn.style.color = "#155724";
            feedback.innerHTML = `<span style="color: #2a9d8f;">⭕答對了！太棒了！</span>`;
        } else {
            btn.style.background = "#f8d7da";
            btn.style.borderColor = "#f5c6cb";
            btn.style.color = "#721c24";
            feedback.innerHTML = `<span style="color: #e76f51;">❌ 答錯囉！</span>`;
            
            // 標示出正確答案
            buttons.forEach(b => {
                if (b.innerText === correctAnswer) {
                    b.style.background = "#d4edda";
                    b.style.borderColor = "#c3e6cb";
                }
            });
        }

        document.getElementById("scoreDisplay").innerText = `得分：${score} / ${maxQuizLimit}`;
        
        // 如果還沒滿 10 題，顯示下一題按鈕；若是第 10 題則顯示結算
        if (quizCount < maxQuizLimit) {
            document.getElementById("nextQuizBtn").style.display = "block";
        } else {
            document.getElementById("nextQuizBtn").style.display = "block";
            document.getElementById("nextQuizBtn").innerText = "看總成績 🏆";
        }
    }

    function nextQuiz() {
        document.getElementById("nextQuizBtn").innerText = "下一題 ➡️";
        startQuiz();
    }

    // 初始化
    updateLearnCard();
</script>

</body>
</html>
